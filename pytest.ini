[pytest]
addopts = -ra --strict-markers -p no:cacheprovider
testpaths =
    tests
markers =
    unit: isolated deterministic unit tests
    module: one module with real local adapters
    integration: connections between multiple application modules
    behavior: observable Agent design-principle tests
    security: authorization, traversal, confirmation, and tamper-resistance tests
    scenario: complete user-facing workflow tests
norecursedirs =
    .venv
    .git
    .pytest_cache
    .pytest_tmp
    .pytest_workspace
    pytest-cache-files-*
    legacy
